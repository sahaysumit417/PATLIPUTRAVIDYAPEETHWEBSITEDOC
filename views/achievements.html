<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Achievements | Patliputra Vidyapeeth</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/c.css">
    <style>
        .achieve-container { max-width: 1200px; margin: 120px auto 50px; padding: 0 20px; }
        
        /* 🎯 TAB NAVIGATION BUTTONS STYLING */
        .tab-nav-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #131c2e;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .tab-btn:hover, .tab-btn.active-tab {
            background: #aeea00;
            color: #0b0f19;
            border-color: #aeea00;
            box-shadow: 0 4px 12px rgba(174, 234, 0, 0.2);
        }

        .section-block { margin-bottom: 30px; }
        .section-title { font-size: 1.6rem; color: #aeea00; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .achieve-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .achieve-card { background: #131c2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 20px; text-align: center; color: #fff; }
        .achieve-card img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin: 0 auto 12px; border: 3px solid #aeea00; }
        .achieve-card h4 { margin: 8px 0 4px; font-size: 1.15rem; color: #f8fafc; }
        .achieve-card p { font-size: 0.88rem; color: #94a3b8; margin: 0; }
    </style>
</head>
<body>

    <nav id="dynamic-header"></nav>

    <div class="achieve-container">
        
        <!-- 🎯 FILTER TAB BUTTONS -->
        <div class="tab-nav-bar">
            <a href="/achievements?tab=class-x" id="btn-class-x" class="tab-btn">
                <i class="fas fa-graduation-cap"></i> Class X Result
            </a>
            <a href="/achievements?tab=class-xii" id="btn-class-xii" class="tab-btn">
                <i class="fas fa-user-graduate"></i> Class XII Result
            </a>
            <a href="/achievements?tab=awards" id="btn-awards" class="tab-btn">
                <i class="fas fa-trophy"></i> School Awards
            </a>
        </div>

        <!-- 🎯 DYNAMIC FILTERED DATA DISPLAY -->
        <div class="section-block">
            <h2 id="active-category-title" class="section-title">
                <i class="fas fa-graduation-cap"></i> Class X Board Results
            </h2>
            <div id="filtered-achieve-grid" class="achieve-grid">
                <p style="color:#94a3b8; grid-column: 1/-1;">Loading achievements...</p>
            </div>
        </div>

    </div>

    <footer id="dynamic-footer"></footer>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // URL Query Parameter ?tab= Read karo (Default 'class-x')
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab') || 'class-x';

            // Active Tab Highlight Karo
            highlightTabButton(activeTab);

            // Database se Data Fetch Karo
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    const allAchievements = data.achievements || [];
                    renderSingleCategory(activeTab, allAchievements);
                })
                .catch(err => console.error("Error loading achievements:", err));
        });

        // 🎯 Active Button State Setter
        function highlightTabButton(tabKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            
            const activeBtn = document.getElementById(`btn-${tabKey}`);
            if (activeBtn) {
                activeBtn.classList.add('active-tab');
            }

            // Heading Dynamic Change
            const titleElement = document.getElementById('active-category-title');
            if (tabKey === 'class-xii') {
                titleElement.innerHTML = `<i class="fas fa-user-graduate"></i> Class XII Board Results`;
            } else if (tabKey === 'awards') {
                titleElement.innerHTML = `<i class="fas fa-trophy"></i> School Awards & Recognition`;
            } else {
                titleElement.innerHTML = `<i class="fas fa-graduation-cap"></i> Class X Board Results`;
            }
        }

        // 🎯 Single Category Display Renderer (No Scroll, Pure Filter View)
        function renderSingleCategory(catKey, allData) {
            const grid = document.getElementById('filtered-achieve-grid');
            const filtered = allData.filter(item => item.category === catKey);

            if (filtered.length === 0) {
                grid.innerHTML = "<p style='color:#94a3b8; grid-column: 1/-1; text-align:center;'>इस कैटेगरी में कोई रिकॉर्ड उपलब्ध नहीं है।</p>";
                return;
            }

            grid.innerHTML = "";
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="achieve-card">
                        ${item.photo ? `<img src="${item.photo}" alt="${item.title}">` : ''}
                        <h4>${item.title}</h4>
                        ${item.description ? `<p>${item.description}</p>` : ''}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
