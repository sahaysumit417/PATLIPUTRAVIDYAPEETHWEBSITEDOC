<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Toppers & Wall of Fame | Patliputra Vidyapeeth</title>
    <!-- Browser Tab Icon (Favicon) -->
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="shortcut icon" type="image/png" href="/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/c.css">
    
    <!-- 🚀 CANVAS CONFETTI LIBRARY FOR CELEBRATION ANIMATION -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --dark-green: #064e3b;
            --badge-gold: #f59e0b;
        }

        body {
            background-color: #ffffff;
            color: #1f2937;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        .achieve-container { 
            max-width: 1250px; 
            margin: 110px auto 50px; 
            padding: 0 20px; 
        }

        /* 🎯 HEADING TITLE */
        .simple-page-header {
            border-left: 5px solid var(--dark-green);
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .simple-page-header h1 {
            font-size: 1.8rem;
            color: var(--dark-green);
            margin: 0 0 4px 0;
            font-weight: 800;
        }

        .simple-page-header p {
            color: #4b5563;
            margin: 0;
            font-size: 0.9rem;
        }

        /* 📐 FLEX CONTENT SECTION (TOPPERS LEFT + CARTOON RIGHT) */
        .page-content-flex {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            position: relative;
        }

        .left-toppers-section {
            flex: 1;
        }

        /* 🎯 DARK GREEN TAB BUTTONS */
        .tab-nav-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #ffffff;
            color: var(--dark-green);
            border: 1.5px solid var(--dark-green);
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .tab-btn:hover, .tab-btn.active-tab {
            background: var(--dark-green);
            color: #ffffff;
        }

        /* 📸 MICRO-COMPACT YEARBOOK GRID LAYOUT */
        .yearbook-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
        }

        /* 🖼️ MICRO YEARBOOK ITEM */
        .yearbook-frame-item {
            background: transparent;
            position: relative;
            padding: 0;
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: cardLoadAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes cardLoadAppear {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 👑 1. TOP-LEFT SCHOOL RANK CREST */
        .left-congrats-crest {
            position: absolute;
            top: -6px;
            left: -4px;
            z-index: 10;
            background: var(--dark-green);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.62rem;
            padding: 2px 6px;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 2px;
            border: 1px solid #ffffff;
            transform: rotate(-3deg);
            white-space: nowrap;
        }

        /* 👑 2. CLEAN MICRO PHOTO FRAME */
        .clean-photo-frame {
            position: relative;
            width: 100%;
            height: 125px;
            border-radius: 6px;
            overflow: hidden;
            border: 1.5px solid var(--dark-green);
            background: #f3f4f6;
        }

        .clean-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 👑 3. WHITE GLASS VIEW BOTTOM NAME TAG PLATE */
        .bottom-name-ribbon {
            width: calc(100% + 6px);
            margin-top: -15px;
            z-index: 5;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: var(--dark-green);
            text-align: center;
            padding: 4px 6px;
            border-radius: 5px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(6, 78, 59, 0.3);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .bottom-name-ribbon .tag-class-label {
            font-size: 0.58rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #0d9488;
            background: #ccfbf1;
            padding: 1px 4px;
            border-radius: 6px;
            display: inline-block;
            margin: 0 auto 1px auto;
        }

        .bottom-name-ribbon .student-name {
            font-size: 0.78rem;
            font-weight: 800;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--dark-green);
            letter-spacing: -0.2px;
        }

        .bottom-name-ribbon .score-tag {
            font-size: 0.72rem;
            font-weight: 800;
            color: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        /* 👑 4. YEAR LABEL */
        .year-sub-label {
            font-size: 0.72rem;
            color: #4b5563;
            margin-top: 4px;
            font-weight: 600;
        }

        .award-photo-frame {
            height: 105px;
        }

        /* 🎓 RIGHT SIDE STANDING CARTOON (IN-BODY CONTENT, FULL TRANSPARENT) */
        .right-mascot-box {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-top: 10px;
        }

        .right-mascot-box img {
            width: 100%;
            max-width: 240px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
            background: transparent;
        }

        @media (max-width: 900px) {
            .page-content-flex {
                flex-direction: column;
            }
            .right-mascot-box {
                width: 100%;
                margin-top: 20px;
            }
            .right-mascot-box img {
                max-width: 180px;
            }
        }

        @media (max-width: 600px) {
            .yearbook-grid {
                grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
                gap: 14px;
            }
            .clean-photo-frame {
                height: 110px;
            }
        }
    </style>
</head>
<body>

    <!-- 🎯 DYNAMIC HEADER -->
    <nav id="dynamic-header"></nav>

    <div class="achieve-container">
        
        <!-- 🎯 PAGE TITLE HEADER -->
        <div class="simple-page-header">
            <h1>🎉 Academic Toppers & Wall of Fame</h1>
            <p>Patliputra Vidyapeeth proudly presents our outstanding achievers.</p>
        </div>

        <!-- 📐 FLEX WRAPPER FOR TOPPERS + CARTOON -->
        <div class="page-content-flex">
            
            <!-- LEFT AREA: TABS & CARDS -->
            <div class="left-toppers-section">
                <!-- 🎯 TAB NAV BUTTONS -->
                <div class="tab-nav-bar">
                    <a href="/achievements?tab=class-x" id="btn-class-x" class="tab-btn">
                        <i class="fas fa-graduation-cap"></i> Class X Board
                    </a>
                    <a href="/achievements?tab=class-xii" id="btn-class-xii" class="tab-btn">
                        <i class="fas fa-user-graduate"></i> Class XII Board
                    </a>
                    <a href="/achievements?tab=awards" id="btn-awards" class="tab-btn">
                        <i class="fas fa-trophy"></i> School Awards
                    </a>
                </div>

                <!-- 📸 YEARBOOK FRAME DISPLAY GRID -->
                <div id="yearbook-grid-container" class="yearbook-grid">
                    <p style="grid-column: 1/-1; text-align: center; padding: 20px; color: var(--dark-green); font-size: 0.85rem;">Loading academic toppers...</p>
                </div>
            </div>

            <!-- RIGHT AREA: REAL TRANSPARENT 3D CHARACTER (INSIDE BODY CONTAINER) -->
            <div class="right-mascot-box">
                <img src="https://cdni.iconscout.com/illustration/premium/thumb/graduated-student-holding-degree-certificate-illustration-download-in-svg-png-gif-file-formats--diploma-graduation-pack-school-education-illustrations-6490333.png?f=webp&h=700" alt="3D Graduate Mascot" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4207/4207253.png';">
            </div>

        </div>

    </div>

    <!-- 🎯 DYNAMIC FOOTER -->
    <footer id="dynamic-footer"></footer>

    <!-- 🎯 SCRIPT ENGINE -->
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab') || 'class-x';

            highlightTabButton(activeTab);

            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    const allAchievements = data.achievements || [];
                    renderYearbookTemplateLayout(activeTab, allAchievements);
                    
                    // 🚀 CELEBRATION CONFETTI ANIMATION
                    triggerCelebrationAnimation();
                })
                .catch(err => console.error("Error loading achievements:", err));
        });

        // 🎆 CELEBRATION CONFETTI ANIMATION
        function triggerCelebrationAnimation() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 70,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#064e3b', '#f59e0b', '#ffffff', '#10b981']
                });

                confetti({
                    particleCount: 70,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#064e3b', '#f59e0b', '#ffffff', '#10b981']
                });
            }
        }

        function highlightTabButton(tabKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            const activeBtn = document.getElementById(`btn-${tabKey}`);
            if (activeBtn) activeBtn.classList.add('active-tab');
        }

        function parsePercentage(val) {
            if (!val) return 0;
            const match = String(val).match(/[\d.]+/);
            return match ? parseFloat(match[0]) : 0;
        }

        // 🎯 RENDER YEARBOOK TEMPLATE
        function renderYearbookTemplateLayout(catKey, allData) {
            const gridBox = document.getElementById('yearbook-grid-container');
            let filtered = allData.filter(item => item.category === catKey);

            if (filtered.length === 0) {
                gridBox.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 25px; color: #4b5563; font-size: 0.85rem;">Is category me abhi koi record nahi hai.</p>`;
                return;
            }

            // AUTO SORT HIGHEST PERCENTAGE FIRST
            if (catKey === 'class-x' || catKey === 'class-xii') {
                filtered.sort((a, b) => {
                    const percA = parsePercentage(a.subtitle || a.percentage);
                    const percB = parsePercentage(b.subtitle || b.percentage);
                    return percB - percA;
                });
            }

            gridBox.innerHTML = "";

            filtered.forEach((item, index) => {
                const isAward = catKey === 'awards';
                const rankNum = index + 1;
                const studentImg = item.photo || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(item.title) + '&background=064e3b&color=fff';
                const percentageVal = item.subtitle || item.percentage || 'N/A';
                const yearVal = item.description || item.year || '2026';
                
                const animationDelay = index * 0.05;
                const classLabel = catKey === 'class-xii' ? 'Class XII' : 'Class X';

                if (isAward) {
                    // 🏆 AWARDS FORMAT
                    gridBox.innerHTML += `
                        <div class="yearbook-frame-item" style="animation-delay: ${animationDelay}s;">
                            <div class="left-congrats-crest">🎉 Winner</div>
                            <div class="clean-photo-frame award-photo-frame">
                                <img src="${item.photo || '/uploads/default-event.jpg'}" alt="${item.title}">
                            </div>
                            <div class="bottom-name-ribbon">
                                <span class="tag-class-label">Award</span>
                                <p class="student-name">${item.title}</p>
                                <span class="score-tag"><i class="fas fa-calendar-alt"></i> ${item.subtitle || 'Recent'}</span>
                            </div>
                            <p class="year-sub-label">${item.description || ''}</p>
                        </div>
                    `;
                } else {
                    // 🎓 STUDENT BOARD TOPPER FRAME
                    gridBox.innerHTML += `
                        <div class="yearbook-frame-item" style="animation-delay: ${animationDelay}s;">
                            <!-- 1. TOP-LEFT SCHOOL RANK TAG -->
                            <div class="left-congrats-crest">
                                🏅 School Rank #${rankNum}
                            </div>

                            <!-- 2. CLEAN MICRO PHOTO FRAME -->
                            <div class="clean-photo-frame">
                                <img src="${studentImg}" alt="${item.title}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(item.title)}&background=064e3b&color=fff';">
                            </div>

                            <!-- 3. COMPACT WHITE GLASS VIEW BOTTOM NAME TAG PLATE -->
                            <div class="bottom-name-ribbon">
                                <span class="tag-class-label">${classLabel}</span>
                                <p class="student-name">${item.title}</p>
                                <span class="score-tag"><i class="fas fa-award"></i> Scored ${percentageVal}</span>
                            </div>

                            <!-- 4. YEAR LABEL -->
                            <p class="year-sub-label">Year: ${yearVal}</p>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
