<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Gallery | Patliputra Vidyapeeth</title>
    <meta name="description" content="Explore event photo galleries, annual sports celebrations, and campus cultural activities at Patliputra Vidyapeeth.">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="shortcut icon" type="image/png" href="/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/c.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 0;
        }

        .gallery-main-wrapper {
            max-width: 1280px;
            margin: 130px auto 50px;
            padding: 0 20px;
        }

        /* 🖼️ FRAME WITH VERTICAL LEFT BORDER TEXT BADGE */
        .gallery-frame {
            position: relative;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            padding: 24px 20px 24px 55px; /* Padding for left vertical badge */
            overflow: hidden;
            min-height: 250px;
        }

        /* 🏷️ VERTICAL BADGE ON LEFT BORDER */
        .gallery-frame::before {
            content: "GALLERY";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 38px;
            background: #064e3b; /* School Brand Green */
            color: #ffffff;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 3px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
        }

        /* 🔀 GRID 4 COLUMNS (RIGHT-TO-LEFT LAYOUT, MAX 8 ITEMS) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            direction: rtl; /* Right to Left Flow */
        }

        /* 📸 CARD WITH DIRECT ON-IMAGE OVERLAY */
        .gallery-card {
            position: relative;
            direction: ltr; /* Reset text direction inside cards */
            background: #0f172a;
            border-radius: 10px;
            overflow: hidden;
            height: 210px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .gallery-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(6, 78, 59, 0.2);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.05); /* Smooth Zoom Effect */
        }

        /* 🏷️ TOP-RIGHT CORNER PHOTO COUNT BADGE */
        .gallery-photo-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(6, 78, 59, 0.88);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 🌆 BOTTOM GRADIENT OVERLAY FOR TITLE DIRECTLY ON IMAGE */
        .gallery-card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 12px 10px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 65%, transparent 100%);
            z-index: 2;
        }

        .gallery-card-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 🌟 FULL SCREEN LIGHTBOX MODAL */
        .lightbox-modal {
            display: none;
            position: fixed;
            z-index: 99999;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .lightbox-caption {
            color: #ffffff;
            margin-top: 15px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 2.2rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .lightbox-close:hover {
            color: #aeea00;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 15px;
            user-select: none;
            transition: color 0.2s ease;
        }

        .lightbox-nav:hover {
            color: #aeea00;
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .gallery-frame { padding: 15px 12px 15px 45px; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .gallery-card { height: 160px; }
        }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>

    <nav id="dynamic-header"></nav>

    <div class="gallery-main-wrapper">
        <!-- 🖼️ FRAME CONTAINER WITH LEFT VERTICAL BORDER "GALLERY" -->
        <div class="gallery-frame">
            <div id="gallery-grid" class="gallery-grid">
                <p style="text-align: center; grid-column: 1/-1; color: #64748b; direction: ltr; padding: 20px 0;">
                    Loading events...
                </p>
            </div>
        </div>
    </div>

    <!-- 🌟 FULL SCREEN LIGHTBOX MODAL -->
    <div id="lightbox-modal" class="lightbox-modal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <span class="lightbox-nav lightbox-prev" onclick="changeLightboxImg(-1)">&#10094;</span>
        <span class="lightbox-nav lightbox-next" onclick="changeLightboxImg(1)">&#10095;</span>
        
        <img id="lightbox-target-img" class="lightbox-img" src="" alt="Full View">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <footer id="dynamic-footer"></footer>

    <script src="/js/main.js"></script>
    
    <script>
        let currentAlbumImages = [];
        let currentImgIndex = 0;
        let currentAlbumTitle = "";

        /* 🔍 FULL SCREEN LIGHTBOX MODAL FUNCTIONS */
        function openFullscreenModal(images, index, title) {
            currentAlbumImages = images || [];
            currentImgIndex = index || 0;
            currentAlbumTitle = title || "Gallery Event";

            if (currentAlbumImages.length === 0) return;

            document.getElementById("lightbox-target-img").src = currentAlbumImages[currentImgIndex];
            document.getElementById("lightbox-caption").innerText = `${currentAlbumTitle} (${currentImgIndex + 1}/${currentAlbumImages.length})`;
            document.getElementById("lightbox-modal").classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            document.getElementById("lightbox-modal").classList.remove("active");
            document.body.style.overflow = "auto";
        }

        function changeLightboxImg(step) {
            if (currentAlbumImages.length <= 1) return;

            currentImgIndex = (currentImgIndex + step + currentAlbumImages.length) % currentAlbumImages.length;
            document.getElementById("lightbox-target-img").src = currentAlbumImages[currentImgIndex];
            document.getElementById("lightbox-caption").innerText = `${currentAlbumTitle} (${currentImgIndex + 1}/${currentAlbumImages.length})`;
        }

        // Keyboard Controls
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") changeLightboxImg(-1);
            if (e.key === "ArrowRight") changeLightboxImg(1);
        });
    </script>
</body>
</html>
