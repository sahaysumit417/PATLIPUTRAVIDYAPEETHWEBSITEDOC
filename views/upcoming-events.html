<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events | Patliputra Vidyapeeth</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo.png">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/c.css">
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #ffffff; 
            color: #222222; 
            margin: 0; 
            padding: 0; 
        }

        .container { 
            max-width: 900px; 
            margin: 130px auto 50px; 
            padding: 0 20px; 
        }

        .page-title { 
            font-size: 1.5rem; 
            color: #064e3b; 
            margin-bottom: 25px; 
            font-weight: 600; 
            border-bottom: 2px solid #064e3b; 
            padding-bottom: 8px; 
        }

        /* 📄 ULTRA SIMPLE LIST LAYOUT */
        .event-item { 
            display: flex; 
            gap: 20px; 
            padding: 20px 0; 
            border-bottom: 1px solid #e5e7eb; 
            align-items: flex-start; 
        }

        .event-item img { 
            width: 180px; 
            height: 110px; 
            object-fit: cover; 
            border-radius: 4px; 
            flex-shrink: 0; 
        }

        .event-details h3 { 
            margin: 0 0 6px 0; 
            font-size: 1.1rem; 
            color: #111111; 
            font-weight: 600; 
        }

        .event-meta { 
            font-size: 0.85rem; 
            color: #555555; 
            margin-bottom: 6px; 
        }

        .event-desc { 
            font-size: 0.9rem; 
            color: #444444; 
            margin: 6px 0 0 0; 
            line-height: 1.5; 
        }

        @media (max-width: 600px) {
            .event-item { 
                flex-direction: column; 
            }
            .event-item img { 
                width: 100%; 
                height: 160px; 
            }
        }
    </style>
</head>
<body>

    <nav id="dynamic-header"></nav>

    <div class="container">
        <h1 class="page-title">Upcoming Events</h1>
        
        <div id="upcoming-events-list">
            <p style="color:#666;">Loading events...</p>
        </div>
    </div>

    <footer id="dynamic-footer"></footer>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById("upcoming-events-list");
                    const events = data.upcomingEvents || [];

                    if (events.length === 0) {
                        list.innerHTML = "<p style='color:#666; padding: 15px 0;'>फिलहाल कोई आगामी कार्यक्रम तय नहीं है।</p>";
                        return;
                    }

                    list.innerHTML = "";
                    [...events].reverse().forEach(ev => {
                        list.innerHTML += `
                            <div class="event-item">
                                ${ev.banner ? `<img src="${ev.banner}" alt="${ev.title}">` : ''}
                                <div class="event-details">
                                    <h3>${ev.title}</h3>
                                    <div class="event-meta">
                                        <strong>Date:</strong> ${ev.eventDate || 'TBA'} | <strong>Venue:</strong> ${ev.venue || 'School Campus'}
                                    </div>
                                    ${ev.description ? `<p class="event-desc">${ev.description}</p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => console.error("Error loading events:", err));
        });
    </script>
</body>
</html>
