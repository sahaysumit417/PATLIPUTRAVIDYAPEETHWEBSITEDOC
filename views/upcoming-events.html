<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events | Patliputra Vidyapeeth</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/c.css">
    <style>
        .events-container { max-width: 1200px; margin: 120px auto 50px; padding: 0 20px; }
        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 30px; }
        .event-card { background: #131c2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; color: #fff; }
        .event-card img { width: 100%; height: 200px; object-fit: cover; }
        .event-card-body { padding: 20px; }
        .event-card-body h3 { margin: 0 0 10px 0; color: #aeea00; font-size: 1.2rem; }
        .event-meta { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .event-desc { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; margin-top: 10px; }
    </style>
</head>
<body>

    <nav id="dynamic-header"></nav>

    <div class="events-container">
        <h2 style="font-size: 2rem; border-bottom: 3px solid #aeea00; display: inline-block; padding-bottom: 5px;">
            📅 Upcoming Events & Programs
        </h2>
        
        <div id="upcoming-events-grid" class="events-grid">
            <p style="color:#94a3b8;">Loading upcoming events...</p>
        </div>
    </div>

    <footer id="dynamic-footer"></footer>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById("upcoming-events-grid");
                    const events = data.upcomingEvents || [];

                    if (events.length === 0) {
                        grid.innerHTML = "<p style='grid-column: 1/-1; color:#94a3b8;'>फिलहाल कोई आगामी कार्यक्रम तय नहीं है।</p>";
                        return;
                    }

                    grid.innerHTML = "";
                    [...events].reverse().forEach(ev => {
                        grid.innerHTML += `
                            <div class="event-card">
                                ${ev.banner ? `<img src="${ev.banner}" alt="${ev.title}">` : ''}
                                <div class="event-card-body">
                                    <h3>${ev.title}</h3>
                                    <div class="event-meta"><i class="fas fa-calendar-alt" style="color:#aeea00;"></i> ${ev.eventDate}</div>
                                    <div class="event-meta"><i class="fas fa-map-marker-alt" style="color:#f59e0b;"></i> ${ev.venue}</div>
                                    ${ev.description ? `<p class="event-desc">${ev.description}</p>` : ''}
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => console.error("Error loading upcoming events:", err));
        });
    </script>
</body>
</html>
