<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Events & Updates | Patliputra Vidyapeeth</title>
    <!-- Browser Tab Icon (Favicon) -->
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="shortcut icon" type="image/png" href="/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/c.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #ffffff;
            color: #222222;
            margin: 0;
            padding: 0;
        }

        .main-container {
            max-width: 1200px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }

        /* PURE & SIMPLE HEADING (NO GREEN, NO BORDER, NO SHADOW) */
        .page-title {
            font-size: 1.6rem;
            color: #111111;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* SIMPLE FEED ITEM */
        .event-post-box {
            background: transparent;
            padding: 25px 0;
            border-bottom: 1px solid #eeeeee;
            margin: 0;
            display: flex;
            gap: 35px;
            align-items: flex-start;
        }

        .event-post-box:last-child {
            border-bottom: none;
        }

        .layout-row {
            flex-direction: row;
        }

        .layout-row-reverse {
            flex-direction: row-reverse;
        }

        .post-content-side {
            flex: 1;
        }

        .post-image-side {
            flex: 1.1;
            width: 100%;
        }

        .post-image-grid {
            display: grid;
            gap: 10px;
            width: 100%;
        }

        /* LARGE IMAGE SIZE */
        .post-image-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 4px;
        }

        .post-date-tag {
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 6px;
        }

        .post-title {
            margin: 0 0 10px 0;
            color: #111111;
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .post-desc {
            color: #444444;
            line-height: 1.6;
            margin: 0;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        @media (max-width: 768px) {
            .event-post-box {
                flex-direction: column !important;
                gap: 15px;
            }
            .post-image-grid img {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <nav id="dynamic-header"></nav>

    <div class="main-container">
        <h1 class="page-title">Recent Events & Updates</h1>

        <div id="recent-events-feed">
            <p style="text-align: center; color: #666666; padding: 30px 0;">Loading recent posts...</p>
        </div>
    </div>

    <footer id="dynamic-footer"></footer>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetchRecentEvents();
        });

        function fetchRecentEvents() {
            fetch('/api/data')
                .then(res => res.json())
                .then(data => {
                    const feed = document.getElementById('recent-events-feed');
                    
                    const rawPosts = data.recentPosts || data.events || [];
                    const posts = [...rawPosts].reverse();

                    if (posts.length === 0) {
                        feed.innerHTML = '<p style="text-align:center; color:#666666; padding: 30px 0;">Abhi koi recent post nahi hai.</p>';
                        return;
                    }

                    feed.innerHTML = '';

                    posts.forEach((post, idx) => {
                        const postCard = document.createElement("div");
                        
                        const layoutClass = (idx % 2 === 0) ? 'layout-row' : 'layout-row-reverse';
                        postCard.className = `event-post-box ${layoutClass}`;

                        let imgHTML = '';
                        const imgs = post.images || post.photos || [];
                        const top2Imgs = Array.isArray(imgs) ? imgs.slice(0, 2) : []; 

                        if (top2Imgs.length > 0) {
                            const gridCols = top2Imgs.length === 2 ? 'repeat(2, 1fr)' : '1fr';
                            imgHTML = `
                                <div class="post-image-side">
                                    <div class="post-image-grid" style="grid-template-columns: ${gridCols};">
                                        ${top2Imgs.map(src => `<img src="${src}" alt="Event photo" loading="lazy">`).join('')}
                                    </div>
                                </div>
                            `;
                        }

                        const textHTML = `
                            <div class="post-content-side">
                                <div class="post-date-tag">
                                    <i class="far fa-calendar-alt"></i> ${post.date || 'Recent Update'}
                                </div>
                                <h2 class="post-title">${post.title || post.eventTitle || 'School Activity'}</h2>
                                <p class="post-desc">${post.description || post.eventDescription || ''}</p>
                            </div>
                        `;

                        if (top2Imgs.length > 0) {
                            postCard.innerHTML = textHTML + imgHTML;
                        } else {
                            postCard.innerHTML = textHTML;
                        }

                        feed.appendChild(postCard);
                    });
                })
                .catch(err => {
                    console.error("Error loading posts:", err);
                    document.getElementById('recent-events-feed').innerHTML = '<p style="text-align:center; color:#666666;">Posts load karne me koi dikkat aayi hai.</p>';
                });
        }
    </script>
</body>
</html>
